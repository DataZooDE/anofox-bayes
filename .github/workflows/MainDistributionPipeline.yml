#
# Main pipeline for building and distributing the anofox_bayes extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

# OIDC token needed for AWS credentials in the deploy job.
permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # The Rust core is where the mathematics lives, and `cargo test --workspace`
  # runs in a couple of minutes against the twenty-plus minutes a full
  # cross-platform extension matrix costs. Gating the matrix on it means a
  # broken family or an unformatted file fails fast and cheap.
  rust-tests:
    name: Rust tests and formatting
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The release version lives in three places and cannot live in Cargo.toml
      # (cargo rejects a zero-padded CalVer date as semver), so nothing else notices
      # when one goes stale -- the extension builds, loads, and reports the previous
      # release. On a tag build this also asserts the tag matches the source, so
      # cutting a release with a forgotten bump fails here instead of shipping.
      - name: Version is consistent (and matches the tag, on a tag build)
        run: make check_version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  # The smoke test is the only job that loads the shipped .duckdb_extension in an
  # official DuckDB CLI. Every deploy must require it to have passed; a bare
  # `!cancelled()` would publish a binary that failed it. This checks that gate, so
  # a later edit cannot quietly drop it.
  deploy-gates:
    name: Deploys gated on smoke tests?
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pyyaml && python3 scripts/check_deploy_gates.py

  # Whether the distribution channel is configured at all.
  #
  # DEPLOY_S3_BUCKET is a repository *variable*, so this is readable without exposing
  # anything. Until it and the matching IAM OIDC trust-policy entry exist, every
  # deploy job fails on AccessDenied -- and a pipeline that is permanently red for a
  # known reason trains everyone to ignore it, including on the day it goes red for an
  # unknown one. Skip instead, and say so.
  deploy-configured:
    name: Distribution channel configured?
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ vars.DEPLOY_S3_BUCKET }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::DEPLOY_S3_BUCKET is not set, so the \
            distribution channel is not configured yet. Builds still ran and are \
            attached as artifacts; publishing is skipped rather than failed."
          fi

  duckdb-latest-build:
    name: Build extension binaries (DuckDB latest v1.5.6)
    needs: rust-tests
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_bayes
      enable_rust: true
      # windows_amd64_rtools: only needed for R package builds
      # windows_amd64_mingw: rtools42 MinGW lacks libbcrypt.a needed by Rust getrandom 0.3+
      # wasm_*: blocked upstream, not here. extension-ci-tools pins the WASM job to
      #   dtolnay/rust-toolchain@1.86.0 (_extension_distribution.yml:1128), and argmin
      #   0.11 -- a transitive dependency through anofox-regression -- calls
      #   `is_multiple_of`, stable only from 1.87. Four E0658s, none of them our code:
      #   `cargo check --target wasm32-unknown-emscripten` on 1.97.1 builds
      #   anofox-bayes-core clean, sequential chain loop and all. Excluded rather than
      #   left failing, for the reason `deploy-configured` above gives: a pipeline
      #   that is permanently red for a known reason trains everyone to ignore it.
      #   Delete this line the day upstream bumps the pin.
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-next-build:
    name: Build extension binaries (DuckDB 2.0)
    needs: rust-tests
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_bayes
      enable_rust: true
      reduced_ci_mode: disabled
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-next-smoke-test:
    name: Smoke test (v2.0.0)
    needs: duckdb-next-build
    # Run even when a non-essential build arch failed: the deploy requires this job
    # to succeed, so skipping it would block publishing the archs that did build.
    if: ${{ !cancelled() && needs.duckdb-next-build.result != 'skipped' }}
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v2.0.0
      extension_name: anofox_bayes
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-latest-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-latest-build
    # Run even when a non-essential build arch failed: the deploy requires this job
    # to succeed, so skipping it would block publishing the archs that did build.
    if: ${{ !cancelled() && needs.duckdb-latest-build.result != 'skipped' }}
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_bayes
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-latest-deploy:
    name: Deploy extension binaries (v1.5.6)
    needs: [duckdb-latest-build, deploy-configured, deploy-gates, duckdb-latest-smoke-test]
    # Run the deploy step even when a non-essential build matrix entry fails -- it
    # fans out per arch and only pushes the artifacts that actually exist -- but not
    # at all until the channel is configured, and never after a failed smoke test.
    if: ${{ !cancelled() && needs.duckdb-latest-build.result != 'skipped'
            && needs.deploy-configured.outputs.ready == 'true'
            && needs.deploy-gates.result == 'success'
            && needs.duckdb-latest-smoke-test.result == 'success' }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_bayes
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}

  duckdb-next-deploy:
    name: Deploy extension binaries (v2.0.0)
    needs: [duckdb-next-build, deploy-configured, deploy-gates, duckdb-next-smoke-test]
    # Same gate as the v1.5.6 deploy above. The 2.0 artifacts are named
    # <ext>-v2.0.0-extension-<arch> by v2.0-cyanoptera's ci_phase.py upload, which
    # is the name _extension_deploy.yml downloads, and DuckDB v2.0.0 keeps the
    # 256-byte signature footer extension-upload.sh strips and re-appends -- so
    # the shared deploy workflow needs no 2.0-specific change.
    if: ${{ !cancelled() && needs.duckdb-next-build.result != 'skipped'
            && needs.deploy-configured.outputs.ready == 'true'
            && needs.deploy-gates.result == 'success'
            && needs.duckdb-next-smoke-test.result == 'success' }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_bayes
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths only from a tag: a main push writes only the rolling
      # latest path, so it can never overwrite a tag release's pinned binaries.
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}
