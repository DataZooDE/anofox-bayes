[project]
name = "price-increase"
version = "0.1.0"
description = "Agent 06 — price round simulator on anofox-bayes F6 (hier_elasticity)"
requires-python = ">=3.12"
dependencies = ["anofox-bayes-demo"]

[project.scripts]
price-increase = "price_increase:run"

[build-system]
requires = ["uv_build>=0.11.29,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "price_increase"
module-root = "src"

[tool.uv.sources]
anofox-bayes-demo = { workspace = true }
