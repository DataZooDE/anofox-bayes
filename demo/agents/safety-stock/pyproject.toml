[project]
name = "safety-stock"
version = "0.1.0"
description = "Agent 01 — C-parts safety stock on anofox-bayes F1 (hier_negbin)"
requires-python = ">=3.12"
dependencies = ["anofox-bayes-demo"]

[project.scripts]
safety-stock = "safety_stock:run"

[build-system]
requires = ["uv_build>=0.11.29,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "safety_stock"
module-root = "src"

[tool.uv.sources]
anofox-bayes-demo = { workspace = true }
