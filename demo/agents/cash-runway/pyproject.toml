[project]
name = "cash-runway"
version = "0.1.0"
description = "Agent 04 — cash runway on anofox-bayes F4 (payment_delay)"
requires-python = ">=3.12"
dependencies = ["anofox-bayes-demo"]

[project.scripts]
cash-runway = "cash_runway:run"

[build-system]
requires = ["uv_build>=0.11.29,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cash_runway"
module-root = "src"

[tool.uv.sources]
anofox-bayes-demo = { workspace = true }
