[project]
name = "dunning"
version = "0.1.0"
description = "Agent 05 — dunning prioritisation on anofox-bayes F5 (payer_alive)"
requires-python = ">=3.12"
dependencies = ["anofox-bayes-demo"]

[project.scripts]
dunning = "dunning:run"

[build-system]
requires = ["uv_build>=0.11.29,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dunning"
module-root = "src"

[tool.uv.sources]
anofox-bayes-demo = { workspace = true }
