[workspace]
members = ["crates/anofox-bayes-core", "crates/anofox-bayes-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
authors = ["DataZoo GmbH <info@data-zoo.de>"]
repository = "https://github.com/DataZooDE/anofox-bayes"

[workspace.dependencies]
# Linear algebra. Default features (which pull in faer's own rayon) are off. That is
# not a blanket statement that this crate avoids threads -- see `rayon` below -- but a
# statement about *where* they pay: a pooled fit is one joint system, and faer's
# internal parallelism would compete for the same cores as the group-level parallelism
# without a matching speedup.
#
# Held at 0.23 to match `anofox-stats-core`, which the F2 bridge passes matrices to and
# from: two incompatible `faer::Mat` types across that seam is a build error. `nuts-rs`
# links its own faer 0.24 internally and never sees ours -- the NUTS adapter speaks in
# f64 slices -- so the two trees coexist without meeting.
faer = { version = "0.23", default-features = false, features = ["std", "linalg"] }
# Group-level parallelism for `conjugate_anomaly`, which fits and samples each group
# independently. Used *only* where the work is embarrassingly parallel and the result
# is provably order-independent: every group's draws come from a stream keyed by the
# group's own identity, so the pool size never reaches the numbers. DuckDB runs this
# operator on one thread (`MaxThreads() == 1`, because a posterior is a function of
# every row), so this pool is not competing with DuckDB for a partitioned scan -- it is
# the only parallelism the fit has available.
rayon = "1.10"
# The NUTS engine. `nuts-rs` is maintained by pymc-devs and is the sampler behind
# nutpie; ROADMAP §5 records "writing an MCMC kernel" as a non-goal, so this is a
# pinned dependency and a single adapter file rather than a kernel of our own.
#
# Default features are off because the only thing they add is `rayon`, used by the
# crate's own multi-chain `Sampler`. This engine drives `nuts_rs::Chain` directly, one
# chain at a time -- chains are few and each is long, so the parallelism that pays is
# across groups, not across four chains of one fit. It is also what makes byte-level
# determinism independent of the thread layout rather than merely likely.
#
# The version is pinned to a single patch release. `nuts-rs` is pre-1.0 and its
# `Settings`/`Chain` traits are sealed and unstable across minor versions, so a caret
# range would let a rebuild change a customer's draws without changing an input.
nuts-rs = { version = "=0.18.3", default-features = false }
# Distributions and special functions (log-gamma, quantiles, CDFs).
statrs = "0.18"
# Sampling. `rand_chacha` is the reproducibility guarantee: a counter-based
# stream cipher gives byte-identical draws for a given seed on every platform,
# which the SQL test suite depends on.
rand = { version = "0.8", default-features = false, features = ["std"] }
rand_chacha = "0.3"
rand_distr = "0.4"
# Deterministic model ids / data fingerprints.
blake3 = { version = "1.5", default-features = false, features = ["std"] }
# Config arrives as JSON across the SQL boundary. Default features only: the
# key-sorted BTreeMap representation is what makes a canonical config string --
# and therefore a stable model_id -- possible.
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
libc = "0.2"
# The bridge onto anofox-statistics (roadmap gap 2 / HLD SS3 "reuse before rebuild").
# Pinned to an exact revision, never a branch: this dependency supplies the censored
# AFT likelihood and the curvature primitive that a bridged posterior is built from,
# so a silent upstream change would silently change customers' posteriors. Bumping it
# is a deliberate act that must re-run the SBC suite and consider ALGORITHM_VERSION.
anofox-stats-core = { git = "https://github.com/DataZooDE/anofox-statistics.git", rev = "b7bb49d78825cbec07fd7722652c4d874daf0af6" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
